name: Build RedDrop APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and copy RedDrop code into it
        run: |
          flutter create --platforms=android --org com.reddrop --project-name reddrop build_app
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="RedDrop"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reddrop-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
